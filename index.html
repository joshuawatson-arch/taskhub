<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBSIDIAN • Tasks</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#211735 0%,#0b0a10 46%,#060608 100%);color:#eeeaf6;display:grid;place-items:center;padding:24px}.shell{width:min(720px,100%)}header{text-align:center;margin-bottom:30px}.mark{display:inline-grid;place-items:center;border:1px solid #544467;border-radius:15px;width:48px;height:48px;background:#241a32;color:#cfb4ff;font-size:26px;box-shadow:0 0 50px #7241a82a}h1{font-size:27px;letter-spacing:.34em;margin:15px 0 5px;font-weight:650}header p{color:#928b9f;font-size:13px;margin:0}.panel{border:1px solid #302a3c;border-radius:22px;background:#111018e8;box-shadow:0 24px 90px #0008;overflow:hidden}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:23px 25px;border-bottom:1px solid #292431}.panelhead h2{font-size:16px;margin:0;font-weight:600}.muted{color:#968fa2;font-size:12px}.actions{display:flex;gap:9px}.btn{border:1px solid #41384f;background:#221d2b;color:#ddd4ed;border-radius:10px;padding:10px 13px;font-weight:600;cursor:pointer}.btn:hover{background:#32273f}.primary{background:#8153cb;color:white;border-color:#9666dd}.primary:hover{background:#9869dc}.task{padding:17px 24px;border-bottom:1px solid #27232f;display:flex;align-items:center;gap:16px}.task:last-child{border-bottom:0}.info{flex:1;min-width:0}.name{font-size:14px;font-weight:600;overflow-wrap:anywhere}.meta{color:#90879d;font-size:12px;margin-top:6px}.done .name{text-decoration:line-through;color:#918b9b}.empty{text-align:center;padding:54px 20px;color:#8f879b}.empty strong{display:block;color:#d4cadd;margin-bottom:7px}.foot{font-size:12px;color:#756d81;text-align:center;margin-top:18px}.dialog{border:1px solid #50405e;border-radius:18px;background:#17131e;color:#eeeaf6;padding:24px;width:min(510px,calc(100% - 32px));box-shadow:0 25px 100px #000b}.dialog::backdrop{background:#050409bd}input,textarea{width:100%;border:1px solid #3d334b;border-radius:10px;background:#0c0a11;color:white;padding:12px;margin:7px 0 15px;font:inherit}textarea{min-height:115px;resize:vertical}.dialog h3{margin-top:0}.row{display:flex;justify-content:flex-end;gap:9px}.note{font-size:12px;color:#9b91a8;line-height:1.6}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #b78aff;outline-offset:2px}@media(max-width:480px){.task{padding:15px;gap:9px}.panelhead{padding:19px 16px}.btn{padding:9px 10px}}
</style></head><body><main class="shell"><header><div class="mark">◈</div><h1>OBSIDIAN</h1><p>One place for everything that needs doing.</p></header><section class="panel"><div class="panelhead"><div><h2>Scanned tasks</h2><span class="muted" id="count">0 tasks</span></div><div class="actions"><button class="btn" id="import">Import</button><button class="btn primary" id="add">+ Add</button></div></div><div id="tasks"></div></section><div class="foot">Tasks stay in this browser · AI completion requires a connected service</div></main><dialog class="dialog" id="editor"><form method="dialog" id="editForm"><h3>Add task</h3><label>Task title<input id="title" maxlength="160" required placeholder="e.g. Finish history assignment"></label><label>Instructions<textarea id="details" placeholder="Paste assignment details here"></textarea></label><label>Due date (optional)<input type="date" id="due"></label><div class="row"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="save" value="save">Save task</button></div></form></dialog><dialog class="dialog" id="viewer"><h3 id="viewTitle"></h3><p id="viewDetails" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><p class="note" id="viewMeta"></p><p class="note" id="status"></p><div class="row"><button class="btn" id="closeView">Close</button><button class="btn primary" id="draft">Prepare with AI</button></div></dialog><input type="file" id="file" accept=".txt,.eml,.csv,.ics,.html" hidden multiple><script>
'use strict';const KEY='obsidian-tasks-v2';const $=id=>document.getElementById(id);let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{}let active=null;function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function make(title,details='',due=''){tasks.unshift({id:crypto.randomUUID(),title:String(title).slice(0,160),details:String(details).slice(0,20000),due,done:false,created:Date.now()});persist()}function render(){const root=$('tasks');root.replaceChildren();$('count').textContent=`${tasks.length} task${tasks.length===1?'':'s'}`;if(!tasks.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>No tasks yet</strong>Scan a webpage with your bookmark or add a task';root.append(e);return}for(const t of tasks){const row=document.createElement('div');row.className='task'+(t.done?' done':'');const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=t.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=(t.due?'Due '+t.due+' · ':'')+(t.done?'Completed':'Pending');info.append(name,meta);const btn=document.createElement('button');btn.className='btn'+(t.done?'':' primary');btn.textContent=t.done?'View':'Complete';btn.onclick=()=>openTask(t.id);row.append(info,btn);root.append(row)}}function openTask(id){active=tasks.find(t=>t.id===id);if(!active)return;$('viewTitle').textContent=active.title;$('viewDetails').textContent=active.details||'No instructions provided';$('viewMeta').textContent=(active.due?'Due: '+active.due+' · ':'')+(active.done?'Marked completed':'Not completed');$('status').textContent='Automatic AI completion is not connected yet. You can prepare this task for ChatGPT, review the result, then mark it complete.';$('draft').textContent='Prepare with AI';$('viewer').showModal()}$('closeView').onclick=()=>$('viewer').close();$('draft').onclick=async()=>{if(!active)return;const prompt=`Help me complete this task. Explain what is needed and produce a draft I can review, without submitting anything.\nTask: ${active.title}\nInstructions: ${active.details}`;try{await navigator.clipboard.writeText(prompt);$('status').textContent='Task copied. Opening ChatGPT. Paste the prompt there to get a draft.';window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}catch{$('status').textContent='Could not copy automatically. Copy the task instructions and paste them into ChatGPT.'}};$('add').onclick=()=>{$('editForm').reset();$('editor').showModal()};$('editForm').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;const title=$('title').value.trim();if(title)make(title,$('details').value,$('due').value)});$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let n=0;for(const f of e.target.files){if(f.size>2e6)continue;const s=await f.text();const clean=s.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();const lines=s.split(/\r?\n/).filter(x=>/assignment|homework|deadline|due|submit|task|complete by/i.test(x));if(lines.length){for(const line of lines.slice(0,12)){make(line.trim().slice(0,160),`Source: ${f.name}\n\n${clean.slice(0,5000)}`);n++}}else{make(f.name,clean.slice(0,5000));n++}}e.target.value='';alert(`Imported ${n} possible task${n===1?'':'s'}. Check each result for accuracy.`)};
// Accept bookmarklet data through a URL fragment, without sending content to GitHub servers.
try{const h=location.hash.slice(1);if(h){const p=new URLSearchParams(h);const raw=p.get('task')||p.get('import')||p.get('text');const old=p.get('outlook-import');let data=raw||'';if(!data&&old){try{const obj=JSON.parse(old);data=(obj.subject?obj.subject+'\n':'')+(obj.text||'')}catch{}}if(data&&data.length<15000){data=data.trim();if(confirm('Import this scanned page into OBSIDIAN?')){const lines=data.split('\n').map(x=>x.trim()).filter(Boolean);const title=lines.find(x=>/assignment|assessment|homework|task|worksheet|project|due/i.test(x))||lines.find(x=>x.length>12)||'Scanned page';make(title.slice(0,160),data)}}history.replaceState(null,'',location.pathname+location.search)}}}catch{}render();
</script></body></html>
