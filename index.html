<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskHub</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e9ecf5;background:#0b0e16}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}aside{width:225px;background:#111521;border-right:1px solid #242a39;padding:26px 16px;position:fixed;inset:0 auto 0 0}h1{font-size:23px;margin:0 0 6px}.sub{color:#8893aa;font-size:12px;margin-bottom:36px}.nav{width:100%;border:0;text-align:left;padding:13px 15px;color:#aab4c9;background:transparent;border-radius:12px;margin-bottom:5px}.nav.active{background:#252d46;color:#dbe5ff}main{margin-left:225px;padding:34px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{font-size:28px;margin:0 0 6px}.muted{color:#8994ab}.primary{border:0;background:#7868f6;color:white;border-radius:11px;padding:11px 17px;font-weight:650}.secondary{background:#1b2131;color:#e0e5f1;border:1px solid #333c51;border-radius:10px;padding:10px 13px}.toolbar{display:flex;gap:10px;margin:28px 0;flex-wrap:wrap}input,textarea,select{background:#171c2b;border:1px solid #343c50;color:#f2f4ff;border-radius:10px;padding:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:#8c80fa}#search{min-width:240px;flex:1}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}.stat,.task,.empty{background:#141a28;border:1px solid #2b3243;border-radius:15px;padding:20px}.stat strong{display:block;font-size:27px;margin-top:9px}.tasks{display:grid;gap:12px}.task{display:flex;align-items:center;gap:15px;text-align:left;width:100%;color:inherit;cursor:pointer}.task:hover{border-color:#7868f6;background:#1a2033}.task .grow{flex:1;min-width:0}.task h3{font-size:16px;margin:0 0 7px;overflow-wrap:anywhere}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#29334b;color:#b9c8ee;display:inline-block}.overdue{color:#ff9f9f}.done{color:#8ed9ad}.empty{text-align:center;padding:48px;color:#99a5bb}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}.modal{background:#151b2a;border:1px solid #343d51;border-radius:18px;padding:25px;width:min(570px,100%);max-height:90vh;overflow:auto}.modal h2{font-size:22px}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:13px;color:#acb7ce}textarea{min-height:115px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.danger{color:#ffb5b5}.hidden{display:none!important}a{color:#acb0ff;overflow-wrap:anywhere}.foot{font-size:12px;color:#7e8ba5;margin-top:24px;line-height:1.5}@media(max-width:700px){aside{position:static;width:auto;border-right:0;border-bottom:1px solid #242a39;padding:15px}aside .sub{margin-bottom:12px}.nav{display:inline-block;width:auto;margin-right:4px;padding:9px}main{margin:0;padding:20px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:22px}}
</style></head><body><aside><h1>◈ TaskHub</h1><div class="sub">Your work. One place.</div><button class="nav active" data-filter="all">▦ &nbsp; All tasks</button><button class="nav" data-filter="todo">◷ &nbsp; To do</button><button class="nav" data-filter="done">✓ &nbsp; Completed</button><button class="nav" data-filter="overdue">! &nbsp; Overdue</button><div class="foot">Private, local task manager.<br>Toddle auto-sync is not connected.</div></aside><main><div class="top"><div><h2>My tasks</h2><div class="muted">Keep everything organised</div></div><button class="primary" id="add">+ New task</button></div><div class="stats"><div class="stat"><span class="muted">Total</span><strong id="total">0</strong></div><div class="stat"><span class="muted">To do</span><strong id="todo">0</strong></div><div class="stat"><span class="muted">Overdue</span><strong id="late">0</strong></div></div><div class="toolbar"><input id="search" placeholder="Search tasks or descriptions..."><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input type="file" id="file" accept="application/json,.json" class="hidden"></div><section class="tasks" id="tasks"></section></main><div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="top"><h2 id="modalTitle">New task</h2><button class="secondary" id="close">✕</button></div><form id="form"><div class="field"><label for="name">Task name</label><input id="name" maxlength="160" required placeholder="e.g. Viking assignment"></div><div class="field"><label for="desc">Details / instructions</label><textarea id="desc" placeholder="What needs to be done?"></textarea></div><div class="field"><label for="due">Due date</label><input id="due" type="date"></div><div class="field"><label for="source">Source</label><select id="source"><option>Toddle</option><option>Computer</option><option>Email</option><option>Other</option></select></div><div class="field"><label for="url">Original task link (optional)</label><input id="url" type="url" placeholder="https://..."></div><div class="field"><label><input id="complete" type="checkbox"> Completed</label></div><div class="actions"><button type="submit" class="primary">Save task</button><button type="button" class="secondary" id="visit">Open original link</button><button type="button" class="secondary danger" id="delete">Delete task</button></div></form></div></div><script>
(()=>{'use strict';const KEY='taskhub.tasks.v1';let tasks=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))tasks=x.filter(t=>t&&typeof t.name==='string')}catch{}let filter='all',editing=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{alert('Browser storage unavailable. Export a backup to save your tasks.')}};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const late=t=>!t.done&&t.due&&t.due<today();function render(){const q=$('search').value.toLowerCase();$('total').textContent=tasks.length;$('todo').textContent=tasks.filter(t=>!t.done).length;$('late').textContent=tasks.filter(late).length;const list=tasks.filter(t=>(filter==='all'||filter==='todo'&&!t.done||filter==='done'&&t.done||filter==='overdue'&&late(t))&&(t.name+' '+(t.desc||'')+' '+(t.source||'')).toLowerCase().includes(q)).sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999'));const root=$('tasks');root.replaceChildren();if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent='No tasks here yet. Click + New task to add one.';root.append(d)}for(const t of list){const b=document.createElement('button');b.className='task';const check=document.createElement('span');check.textContent=t.done?'☑':'□';check.style.fontSize='24px';const mid=document.createElement('div');mid.className='grow';const h=document.createElement('h3');h.textContent=t.name;const info=document.createElement('div');info.className='muted';info.style.fontSize='13px';info.textContent=(t.source||'Other')+' · '+(t.due?'Due '+t.due:'No due date');if(late(t))info.classList.add('overdue');if(t.done)info.classList.add('done');mid.append(h,info);const pill=document.createElement('span');pill.className='pill';pill.textContent=t.done?'Done':late(t)?'Overdue':'To do';b.append(check,mid,pill);b.onclick=()=>open(t.id);root.append(b)}}function open(id){editing=id;const t=tasks.find(x=>x.id===id);$('modalTitle').textContent=t?'Task details':'New task';$('name').value=t?.name||'';$('desc').value=t?.desc||'';$('due').value=t?.due||'';$('source').value=t?.source||'Toddle';$('url').value=t?.url||'';$('complete').checked=!!t?.done;$('delete').classList.toggle('hidden',!t);$('visit').classList.toggle('hidden',!t?.url);$('overlay').classList.add('open');$('name').focus()}function close(){$('overlay').classList.remove('open')}$('add').onclick=()=>open(null);$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('form').onsubmit=e=>{e.preventDefault();const item={id:editing||((globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random()),name:$('name').value.trim(),desc:$('desc').value,due:$('due').value,source:$('source').value,url:$('url').value.trim(),done:$('complete').checked};if(!item.name)return;if(editing){tasks=tasks.map(t=>t.id===editing?item:t)}else tasks.push(item);save();close();render()};$('delete').onclick=()=>{if(editing&&confirm('Delete this task?')){tasks=tasks.filter(t=>t.id!==editing);save();close();render()}};$('visit').onclick=()=>{const u=$('url').value.trim();try{const p=new URL(u);if(['https:','http:'].includes(p.protocol))window.open(p.href,'_blank','noopener,noreferrer');else alert('Only http and https links are supported')}catch{alert('Enter a valid website link')}};$('search').oninput=render;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));render()});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='taskhub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(t=>t&&typeof t.name==='string'))throw Error();if(confirm('Replace current tasks with '+data.length+' imported tasks?')){tasks=data.map(t=>({id:String(t.id||Math.random()),name:t.name.slice(0,160),desc:String(t.desc||''),due:String(t.due||''),source:String(t.source||'Other'),url:String(t.url||''),done:!!t.done}));save();render()}}catch{alert('Not a valid TaskHub backup file')}e.target.value=''};render()})();
</script></body></html>
